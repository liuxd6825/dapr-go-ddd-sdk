kind: Subscription
metadata:
  name: document.folder.create-event-sub
spec:
  pubsubname: pubsub                           # 引用pubsub组件名称
  topic: "test-master-cdc"                      # 必须映射到 RabbitMQ 的 Exchange 名称
  routes:                                      # 你的应用中接收消息的路由
    default: /subscribe/document/event/folder-create-event
  metadata:
    rawPayload: "true"                                # 非dapr消息，关系配置
    queueName: "test-document.folder.create-event"    # 告诉 Dapr 直接消费这个名字的队列
    routingKey: "document.folder.create-event"   # RabbitMQ中的topic， 多个用“,”逗号分隔;