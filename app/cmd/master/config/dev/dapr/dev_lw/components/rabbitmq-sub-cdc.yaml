apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: master-data-change-su
spec:
  pubsubname: pubsub                           # 引用pubsub组件名称
  topic: "dev-master-cdc"                      # 必须映射到 RabbitMQ 的 Exchange 名称
  routes:                                      # 你的应用中接收消息的路由
    default: /subscribe/graph/master/cdc/data-change
  metadata:
    rawPayload: "true"                        # 非dapr消息，关系配置
    queueName: "dev-master.data-change"               # 告诉 Dapr 直接消费这个名字的队列
    routingKey: "data-change"          # RabbitMQ 中的 topic，多个用“,”逗号分隔