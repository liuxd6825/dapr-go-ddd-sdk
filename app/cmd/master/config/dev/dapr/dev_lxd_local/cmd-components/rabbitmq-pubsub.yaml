apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace:
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: host
      value: "amqp://admin:123456@127.0.0.1:5672"
    - name: exchangeKind
      value: "topic" # <--- 修改这里以匹配现有的交换机类型
    - name: consumerID
      value: "master_cmd_service"
    - name: enableDeadLetter
      value: "true"
    - name: deletedWhenUnused
      value: "false"
    - name: autoAck
      value: "false"
    - name: deliveryMode
      value: "0"
    - name: requeueInFailure
      value: "true"
    - name: prefetchCount
      value: "0"
    - name: reconnectWait
      value: "0"
    - name: concurrencyMode
      value: single
    # 建议为共享队列设置为 durable
    - name: durable
      value: "true"
    # --- 核心解决方案 ---
    # 指定一个固定的队列名称，这个名称将作为消费者ID和队列名称使用。
    # Dapr 将不再添加 app-id 前缀。
    - name: consumerID
      value: "master-cdc-graph" #
    # --- 解决此问题的关键配置 ---
    # 明确禁用 Dapr 的自动死信队列功能。
    # 这会阻止 Dapr 在 QueueDeclare 时发送 'x-dead-letter-exchange' 参数。
    - name: enableDeadLettering
      value: "false"