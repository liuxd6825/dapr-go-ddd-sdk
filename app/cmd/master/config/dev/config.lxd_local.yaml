      storeDbKey: mysql  # 用户mysql存储权限数据
      enable: true
    log:
      outputType: console
      level: debug
      saveDays: 7  #日志保存的天数
      splitHour: 1 #文件分隔时间，单位小时
      logFile: "./logs/${ExeName}.log"
    dapr:
      start: true
      host: 127.0.0.1
      httpPort: 43002
      grpcPort: 43003
      eventStores:
