        log-file: "./logs/${ExeName}.dapr.log"
        log-output-type: "console"
        config: "./config/dev/dapr/dev_lxd_local/config.yaml"
        components-path: "./config/dev/dapr/dev_lxd_local/cmd-components"
        resources-path: "./config/dev/dapr/dev_lxd_local/cmd-components"
        placement-host-address: 127.0.0.1:50005
        scheduler-host-address: 127.0.0.1:50006
        enable-metrics: false
        metrics-port: 9191
    mongo:
