env: dev_lxd_dell
envs:
  dev_lxd_dell:
    app:
      id: "duxm-master-service"
      prodMode: false
      httpPort: 43001
      rootUrl: "/api/v1.0"
      webName: "web"
      authToken: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..s_kHa3pKt6XehbsL7E9PJqywM_pxbbq6V2zHyZCJmDk"
      hServer:
        enable: false
        srcName: "src"
        basePath: ""
        reload: true
        npm:
          links:
          - name: "ui5e"
            path: "/@fs/Users/lxd/Projects/duxm/h-master/packages"
          - name: "draw"
            path: "/@fs/Users/lxd/Projects/duxm/h-draw"
      meta:
        db1: "default"
        ragDb1: "default"
        drawDb1: "default"
        neo4jDb1: "neo4"
        redis1: "default"
        huge1: "huge"
        ory:
          url: "http://192.168.120.224:4434"

    services:
      draw-service:
        enable: true
        hugeDbKey: "huge"

      sys-service:
        enable: true
        mongoDbKey: "mongo"
        imdbKey: "redis"
        ossKey: "minio"
        kratos:
          url: "http://192.168.120.224:4434"

      analysis-service:  # 可疑流水分析
        enable: true
        mongoDbKey: "mongo"
        dorisDbKey: "doris"
        s3Key: "default"
        redisDbKey: "redis"

      tag-service:
        enable: true
        mongoDbKey: "mongo"
        redisDbKey: "redis"

      master-service:
        enable: true
        mongoDbKey: "mongo"
        s3Key: "default"
        redisDbKey: "redis"

      rag-service:
        enable: true
        mongoDbKey: "mongo"
        hugeDbKey: "huge"
        neo4jDbKey: "neo4j"
        redisDbKey: "redis"
        lightRag:
          url: "192.168.120.224"
          apiKey : ""
        rag:
          llm:
            type: "ollama"
            baseUrl: "http://192.168.120.224:11434"
            model: "qwen3.6:27b"
            apiKey: "ollama"
            ctxLength: 32768
            think: "low"
          embedder:
            baseUrl: "http://192.168.120.224:11434"
            model: "bge-m3:latest"
            apiKey: ""
          vector:
            addr: "192.168.120.224:19530"
            collectionName: "graph"
            dim: 1024
        livyServer:
          ip: "192.168.120.200"
          port: 18080

      import-service:  # 数据导入服务
        enable: true
        mongoDbKey: "mongo"
        dorisDbKey: "doris"
        imdbKey: "redis"
        ossKey: "minio"
        ossBucket : "import-data"
        rag:
          llm:
            type: "ollama"
            baseURL: "http://192.168.120.224:11434"
            model: "qwen3.6:27b"
            apiKey: "ollama"
            ctxLength: 32768
            think: "low"
          embedder:
            baseUrl: "http://192.168.120.224:11434"
            model:  "bge-m3:latest"
            apiKey: ""
          vector:
            addr: "192.168.120.224:19530"
            collectionName : "graph"
            dim: 1024
        livyServer:
          ip: "192.168.120.200"
          port: 18080

      graph-service: # 图形数据服务
        enable: true
        mongoDbKey: "mongo"
        dorisDbKey: "doris"
        graphDbKey: "huge"
        imdbKey: "redis"
        ossKey: "minio"
        livyServer:
          ip: "192.168.120.200"
          port: 18080

    dbs:
      mongo:   # master 主数据写数据库
        dbType: "mongodb"
        host: "192.168.120.224:27018,192.168.120.224:27019,192.168.120.224:27020"
        replicaSet: "mongors"
        dbname: "master"
        user: "super_admin"
        password: "123456"
        maxPoolSize: 20
        operationTimeout: "300s"
        socketTimeout: "60s"
        maxConnIdleTime: "60s"
        serverSelectionTimeout: "20s"

      doris: # 银行流水数据分析， 爬网公司库
        dbType: "doris"
        host: "192.168.120.224"
        port: "9030"
        user: "root"
        password: "12345678"
        dbname: "master"
        loc: "Asia/Shanghai"
        parseTime: true
        charset: "utf8mb4"

    graphdb:
      huge:  # 图数据库  用在
        enable: true
        dbType: "hugegraph"
        host: "192.168.120.200"
        port: 18080
        username: "admin"
        password: "admin"

      neo4j:
        enable: true
        dbType: "neo4j"
        host: "192.168.120.224"
        port: "7687"
        dbname: ""
        user: "neo4j"
        password: "12345678"

    imdb: #内存数据库
      redis:
        enable: true
        dbType: "redis"
        host: "192.168.120.224:6379"
        db: 2
        pwd: "123456"
        poolSize: 10

    oss: # 对象存储服务
      minio:
        enable: true
        ossType: "minio"
        endpoint: "192.168.120.224:9000"
        accessKey: "minioadmin"
        secretKey: "minioadmin"
        useSSL: false

    log:
      outputType: console
      level: debug
      saveDays: 7  #日志保存的天数
      splitHour: 1 #文件分隔时间，单位小时
      logFile: "./logs/${ExeName}.log"

    dapr:
      enable: true
      command: "daprd"
      autoStart: true
      host: "127.0.0.1"
      httpPort: 43002
      grpcPort: 43003
      eventStores:
        eventstore:
          pubsub: pubsub
      startArgs:
        log-level: "info"
        log-file: "./logs/dev/${ExeName}.dapr.log"
        log-output-type: "console"
        config: "./config/dev/dapr/${EnvName}/config.yaml"
        components-path: "./config/dev/dapr/${EnvName}/cmd-components"
        resources-path: "./config/dev/dapr/${EnvName}/cmd-components"
        # placement-host-address: 127.0.0.1:50005
        # scheduler-host-address: 127.0.0.1:50006
        enable-metrics: false
        metrics-port: 9191

    temporal:
      host: "192.168.120.224"
      port: 7233
      namespace: "default"
      taskQueue: "master-task"

    fs:
      - name: "documentIoStore"
        type: local
        path: "/Users/lxd/Projects/duxm/h-master/file-store/dev/doc"
      - name: "drawIoStore"
        type: local
        path: "/Users/lxd/Projects/duxm/h-master/file-store/dev/draw"
      - name: "temp"
        type: local
        path: "/Users/lxd/Projects/duxm/h-master/file-store/dev/temp"

      - name: "src"
        type: local
        path: "${HomePath}/server"
        tags:
          - app-src
      - name: "web"
        type: local
        path: "${HomePath}/web/src"
        tags:
          - web-src
      - name: "nodeModules"
        type: local
        path: "${HomePath}/web/node_modules"
        tags:
          - node-modules
      - name: "packages"
        type: local
        path: "${HomePath}/packages"
        tags:
          - node-modules
      - name: "draw_packages"
        type: local
        path: "/Users/lxd/Projects/duxm/h-draw/web"
        tags:
          - node-modules


