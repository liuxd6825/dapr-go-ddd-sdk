<ui5e-sheet id="human-address-data" filters header-menu column-sorting column-resize column-freeze column-move row-resize init-load-data
    auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-address"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-address:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="createRequest" method="post" url="/api/v1.0/human-address:createBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="editRequest" method="put" url="/api/v1.0/human-address:updateBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete"
        url="/api/v1.0/human-address/${$self.cmdData.data.id}"></x-request>
    <script x-func="createModel" type="text/typescript">
        return {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            country: null,
            province: null,
            city: null,
            addr: null,
            purpose: null,
            startDate: null,
            endDate: null,
            used: null,
            remark: null,
        }
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="country" title="国家" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="province" title="省份" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="city" title="城市" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="addr" title="详细地址" type="text" width="400px"></ui5e-sheet-column>
    <ui5e-sheet-column name="purpose" title="用途" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="startDate" title="开始日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="endDate" title="结束日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="used" title="是否常用" type="checkbox" horizontal="center"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text" width="300px"></ui5e-sheet-column>
    <ui5e-sheet-column name="createdTime" title="创建时间" type="date" date-format="YYYY-MM-DD HH:mm:ss"
        hide></ui5e-sheet-column>
    <ui5e-sheet-column name="creatorId" title="创建人Id" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="creatorName" title="创建人" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="updatedTime" title="更新时间" type="date" date-format="YYYY-MM-DD HH:mm:ss"
        hide></ui5e-sheet-column>
    <ui5e-sheet-column name="updaterId" title="更新人Id" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="updaterName" title="更新人" type="text" hide></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
