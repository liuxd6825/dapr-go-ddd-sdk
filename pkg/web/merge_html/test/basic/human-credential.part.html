<ui5e-sheet id="human-credential-data" x-ref="humanCredential" filters header-menu column-sorting column-resize column-freeze column-move row-resize init-load-data
    auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-credential"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-credential:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="createRequest" method="post" url="/api/v1.0/human-credential:createBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="editRequest" method="put" url="/api/v1.0/human-credential:updateBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete" url="/api/v1.0/human-credential/${$self.cmdData.data.id}"
        data="$self.cmdData"></x-request>
    <script x-func="createModel">
        return {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            identType: null,
            identNum: null,
            startDate: null,
            endDate: null,
            used: null,
            remark: null,
        }
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="identType" title="证件类型" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="identNum" title="证件号" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="startDate" title="开始日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="endDate" title="结束日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="used" title="是否常用" type="checkbox" horizontal="center"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text" width="300px"></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
