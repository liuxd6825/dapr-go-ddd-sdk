<ui5e-form id="human-reported-amount-data" xd-root="" xd-html="工具栏" x-ref="humanReportAmount" method="post" url="/api/v1.0/human-reported-amount:submit" layout="S1 M2 L3 XL3" label-span="S12 M12 L12 XL12">
    <ui5e-form-item>
        <ui5-label slot="labelContent">报案投资金额:</ui5-label>
        <ui5-input name="reportInvestAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">报案返款金额:</ui5-label>
        <ui5-input name="reportRefundAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">报案损失金额:</ui5-label>
        <ui5-input name="reportLossAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">合同投资金额:</ui5-label>
        <ui5-input name="contractInvestAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">合同返利金额:</ui5-label>
        <ui5-input name="contractRefundAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">合同损失金额:</ui5-label>
        <ui5-input name="contractLossAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">投资金额差:</ui5-label>
        <ui5-input name="diffInvestAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">返利金额差:</ui5-label>
        <ui5-input name="diffRefundAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <ui5e-form-item>
        <ui5-label slot="labelContent">损失金额差:</ui5-label>
        <ui5-input name="diffLossAmount" type="number" show-clear-icon></ui5-input>
    </ui5e-form-item>
    <script x-func="saveSubmitData" x-args="autoSave" type="text/typescript">
        let isAutoSave = arguments[arguments.length - 1] === true;
        $self.submit({
            data:(data)=>{
                data.id = $data.id;
                data.caseId = $data.caseId;
                data.humanId = $data.id;
                let res = {
                    commandId:$xutil.newId(),
                    data:data,
                }
                return res;
            },
            ok: (data) => {
                if(!isAutoSave) {
                    $refs.page.submitResult.success++;
                } else {
                    $xutil.message("success", "保存成功", undefined, 3000);
                }
            },
            error: (err) => {
                if(!isAutoSave) {
                    $refs.page.submitResult.error++;
                } else {
                    $xutil.message("fail", "保存失败", undefined, 90000000000000000);
                }
            }
        })
    </script>
    <script x-func="initForm" type="text/typescript">
        $xutil.hGet({
            url:'/api/v1.0/human-reported-amount/' + $data.id
        }).then(response => {
            if (response.ok) {
                response.text().then(s => {
                    let res = JSON.parse(s || '{}');
                    if(res) {
                        $refs.humanReportAmount.setValue(res);
                    }
                });
            }
        }).catch(err => {
            console.log('hGet is error, ', err)
        });
    </script>
</ui5e-form>
