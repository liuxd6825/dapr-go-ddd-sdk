<ui5e-sheet id="human-record-data" filters header-menu column-sorting column-resize column-freeze column-move
    row-resize init-load-data auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-record"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-record:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete" url="/api/v1.0/human-record/${$self.cmdData.data.id}"
        data="$self.cmdData"></x-request>
    <script x-func="createModel">
        return {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            title: null,
            content: null,
            status: null,
            recordTime: null,
            recorder: null,
            remark: null,
        }
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="title" title="记录标题" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="content" title="记录内容" type="text" width="400"></ui5e-sheet-column>
    <ui5e-sheet-column name="status" title="分析状态" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="recordTime" title="记录时间" type="date" date-format="YYYY-MM-DD" validator="date"
        allow-invalid correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="recorder" title="记录人" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text"></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
