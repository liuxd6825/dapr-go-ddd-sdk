<ui5e-sheet id="human-account-data" filters header-menu column-sorting column-resize column-freeze column-move row-resize init-load-data
    auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-account"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-account:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="createRequest" method="post" url="/api/v1.0/human-account:createBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="editRequest" method="put" url="/api/v1.0/human-account:updateBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete" url="/api/v1.0/human-account/${$self.cmdData.data.id}"
        data="$self.cmdData"></x-request>
    <script x-func="createModel" type="text/javascript">
        var model = {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            relationType: null,
            orgName: null,
            accountNum: null,
            startDate: null,
            endDate: null,
            used: null,
            remark: null
        }
        return model
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="relationType" title="关系类型" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="orgName" title="机构名称" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="accountNum" title="账号" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="startDate" title="开始日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="endDate" title="结束日期" type="date" date-format="YYYY-MM-DD" validator="date" allow-invalid
        correct-format></ui5e-sheet-column>
    <ui5e-sheet-column name="used" title="是否常用" type="checkbox" horizontal="center"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text" width="300px"></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
