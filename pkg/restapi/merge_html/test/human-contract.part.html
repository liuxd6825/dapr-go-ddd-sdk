<ui5e-sheet id="human-contract-data" filters header-menu column-sorting column-resize column-freeze column-move row-resize init-load-data
    auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-contract"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-contract:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="createRequest" method="post" url="/api/v1.0/human-contract:createBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="editRequest" method="put" url="/api/v1.0/human-contract:updateBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete" url="/api/v1.0/human-contract/${$self.cmdData.data.id}"
        data="$self.cmdData"></x-request>
    <script x-func="createModel">
        return {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            relationType: null,
            name: null,
            code: null,
            firstParty: null,
            secondParty: null,
            amount: null,
            remark: null,
        }
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="relationType" title="关系类型" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="name" title="合同名称" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="code" title="合同编号" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="firstParty" title="甲方" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="secondParty" title="乙方" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="amount" title="合同金额" type="numeric"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text"></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
