<ui5e-sheet id="human-human-data" filters header-menu column-sorting column-resize column-freeze column-move row-resize init-load-data
    auto-add-row save-type="auto" auto-column-width="last" height="100%" xd-root xd-html>
    <x-request x-prop="queryRequest" method="get" url="/api/v1.0/human/${$data.id}/human-human"></x-request>
    <x-request x-prop="submitRequest" method="post" url="/api/v1.0/human-human:submitBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="createRequest" method="post" url="/api/v1.0/human-human:createBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="editRequest" method="put" url="/api/v1.0/human-human:updateBatch"
        data="$self.cmdData"></x-request>
    <x-request x-prop="deleteRequest" method="delete" url="/api/v1.0/human-human/${$self.cmdData.data.id}"
        data="$self.cmdData"></x-request>
    <script x-func="createModel">
        return {
            id: $xutil.newId(),
            tenantId: null,
            caseId: $data.caseId,
            humanId: $data.id,
            relationType: null,
            name: null,
            gender: null,
            age: null,
            identNum: null,
            link: null,
            addr: null,
            remark: null,
        }
    </script>
    <ui5e-sheet-column name="id" title="主键" type="text" pk hide></ui5e-sheet-column>
    <ui5e-sheet-column name="tenantId" title="租户" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="caseId" title="项目" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="humanId" title="人员" type="text" hide></ui5e-sheet-column>
    <ui5e-sheet-column name="relationType" title="关系类型" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="name" title="姓名" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="gender" title="性别" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="age" title="年龄" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="identNum" title="证件号" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="link" title="联系方式" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="addr" title="地址" type="text"></ui5e-sheet-column>
    <ui5e-sheet-column name="remark" title="备注" type="text"></ui5e-sheet-column>
    <script x-func="saveSubmitData" type="text/typescript">
        $self.saveData(()=>{
            $refs.page.submitResult.success++;
        }, ()=>{
            $refs.page.submitResult.error++;
        });
    </script>
</ui5e-sheet>
