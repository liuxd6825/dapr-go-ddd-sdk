env: dev_lxd
envs:

  dev_lxd:
    app:
      id: duxm-master-cmd-service
      httpPort: 19020
      rootUrl: /api/v1.0
      authToken: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..s_kHa3pKt6XehbsL7E9PJqywM_pxbbq6V2zHyZCJmDk"
      rsServer:
        enable: true
        srcName: "src"
        webName: "web"
        basePath: ""
        reload: true
    fs:
      - name: "src"
        type: local
        path: "${WorkPath}/server"
      - name: "web"
        type: local
        path: "${WorkPath}/web"
    log:
      outputType: console
      level: debug
      saveDays: 7  #日志保存的天数
      splitHour: 1 #文件分隔时间，单位小时
      logFile: "./logs/${ExeName}.log"
    dapr:
      host: localhost
      httpPort: 19021
      grpcPort: 19022
      eventStores:
        eventstore:
          pubsub: pubsub
      server:
        start: true
        enableMetrics: false
        logLevel: "info"
        logFile: "./logs/${ExeName}.dapr.log"
        logOutputType: "console"
        config: "./config/dapr/${EnvName}/config.yaml"
        componentsPath: "./config/dapr/${EnvName}/cmd-components"
        placementHostAddress: 127.0.0.1:50005
    mongo:
      default:
        host: 192.168.65.5:27018,192.168.65.5:27019,192.168.65.5:27020
        replicaSet: mongors
        dbname: dev_master_cmd
        user: master
        pwd: 123456
        maxPoolSize: 20
        operationTimeout: 300s
        socketTimeout: 60s
        maxConnIdleTime: 60s
        serverSelectionTimeout: 20s


